name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: write
  pull-requests: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install ruff
      - name: Run Ruff
        run: ruff check .
      - name: Run Ruff format check
        run: ruff format --check .

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        run: pytest --cov=ghostly --cov-report=xml -v
      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  build:
    name: Build EXE
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    needs: [lint, test]
    if: github.event_name == 'release'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pyinstaller>=6.0.0
          pip install aiohttp>=3.9.0 aiosqlite>=0.19.0
      - name: Build EXE (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          pyinstaller \
            --onefile \
            --name "ghostly-${{ runner.os }}" \
            --add-data "ghostly/templates:ghostly/templates" \
            --add-data "ghostly/static:ghostly/static" \
            --hidden-import ghostly \
            --hidden-import ghostly.core \
            --hidden-import ghostly.core.server \
            --hidden-import ghostly.api \
            --hidden-import ghostly.dashboard \
            --hidden-import aiohttp \
            --hidden-import aiosqlite \
            --console \
            --clean \
            launch.py
      - name: Build EXE (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller `
            --onefile `
            --name "ghostly-${{ runner.os }}" `
            --add-data "ghostly/templates;ghostly/templates" `
            --add-data "ghostly/static;ghostly/static" `
            --hidden-import ghostly `
            --hidden-import ghostly.core `
            --hidden-import ghostly.core.server `
            --hidden-import ghostly.api `
            --hidden-import ghostly.dashboard `
            --hidden-import aiohttp `
            --hidden-import aiosqlite `
            --console `
            --clean `
            launch.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghostly-${{ runner.os }}
          path: dist/

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'release'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: pip install build twine
      - name: Build package
        run: python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
